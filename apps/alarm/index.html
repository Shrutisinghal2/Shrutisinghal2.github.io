<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alarm Clock · Shruti Singhal</title>
<link rel="stylesheet" href="../common.css">
<style>
  :root{--dark-blue:#243356;--yellow:#ffcd0a;--light-blue:#00d9fe}
  body{min-height:100vh;background:linear-gradient(160deg,#0f1a33,#1b2a4d 60%,#2b3f6e);padding:64px 16px 32px;color:#fff}
  .card{max-width:440px;margin:0 auto;padding:30px;background:var(--dark-blue);border-radius:16px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  h1{color:var(--yellow);font-size:36px;text-align:center;font-weight:500;margin:0}
  .clock{display:block;margin:20px auto;width:170px;height:170px}
  .shake{animation:shake .5s infinite}
  @keyframes shake{0%{transform:translate(1px,1px) rotate(0)}20%{transform:translate(-3px,0) rotate(1deg)}40%{transform:translate(1px,-1px) rotate(1deg)}60%{transform:translate(-3px,1px) rotate(0)}80%{transform:translate(-1px,-1px) rotate(1deg)}100%{transform:translate(1px,-2px) rotate(-1deg)}}
  h2{font-size:44px;text-align:center;font-weight:500;color:var(--light-blue);margin:10px auto 26px;font-variant-numeric:tabular-nums}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  label{font-size:13px;display:block;margin-bottom:4px}
  select{width:100%;padding:9px;border-radius:6px;border:0;font-size:15px;color:var(--dark-blue)}
  button{width:100%;background:var(--yellow);border:0;color:var(--dark-blue);font-size:20px;padding:14px;border-radius:6px;margin-top:18px;cursor:pointer;font-weight:600}
  button:disabled{opacity:.5;cursor:not-allowed}
  .status{text-align:center;margin-top:12px;min-height:20px;color:var(--light-blue)}
</style>
</head>
<body>
<a class="back" href="../../">← Portfolio</a>
<div class="card">
  <h1>Alarm Clock</h1>
  <svg class="clock" id="clock" viewBox="0 0 200 200" aria-hidden="true">
    <circle cx="48" cy="40" r="26" fill="#ffcd0a"/><circle cx="152" cy="40" r="26" fill="#ffcd0a"/>
    <path d="M60 175l-14 18M140 175l14 18" stroke="#ffcd0a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="100" cy="108" r="78" fill="#ffcd0a"/><circle cx="100" cy="108" r="64" fill="#fff"/>
    <g stroke="#243356" stroke-width="4" stroke-linecap="round"><path d="M100 52v10M100 154v10M44 108h10M146 108h10"/></g>
    <path id="hHand" d="M100 108V76" stroke="#243356" stroke-width="7" stroke-linecap="round"/>
    <path id="mHand" d="M100 108V62" stroke="#00b7d6" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="108" r="6" fill="#243356"/>
  </svg>
  <h2 id="time">--:--:-- --</h2>
  <div class="row">
    <div><label for="h">Hour(s)</label><select id="h"><option value="">Hour</option></select></div>
    <div><label for="m">Minute(s)</label><select id="m"><option value="">Min</option></select></div>
    <div><label for="ap">AM/PM</label><select id="ap"><option value="">AM/PM</option><option>AM</option><option>PM</option></select></div>
  </div>
  <button id="set" disabled>Set Alarm</button>
  <button id="clear" hidden>Clear Alarm</button>
  <div class="status" id="status"></div>
</div>
<p class="credit">Web version of my Salesforce LWC project</p>
<script>
  const pad = n => String(n).padStart(2, '0');
  for (let i = 1; i <= 12; i++) h.add(new Option(pad(i)));
  for (let i = 0; i < 60; i++) m.add(new Option(pad(i)));
  let alarmTime = '', ringing = false, ctx, osc;
  const check = () => set.disabled = !(h.value && m.value && ap.value);
  [h, m, ap].forEach(s => s.onchange = check);
  function ring() {
    if (ringing) return; ringing = true; clock.classList.add('shake'); status.textContent = '⏰ Wake up!';
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      osc = ctx.createOscillator(); const g = ctx.createGain();
      osc.type = 'square'; osc.frequency.value = 880; g.gain.value = 0;
      osc.connect(g).connect(ctx.destination); osc.start();
      for (let t = 0; t < 60; t++) { g.gain.setValueAtTime(.08, ctx.currentTime + t * .5); g.gain.setValueAtTime(0, ctx.currentTime + t * .5 + .25); }
    } catch (e) {}
  }
  function tick() {
    const d = new Date(); let hr = d.getHours(); const ampm = hr >= 12 ? 'PM' : 'AM';
    hr = hr % 12 || 12;
    time.textContent = `${pad(hr)}:${pad(d.getMinutes())}:${pad(d.getSeconds())} ${ampm}`;
    hHand.setAttribute('transform', `rotate(${(hr % 12) * 30 + d.getMinutes() / 2} 100 108)`);
    mHand.setAttribute('transform', `rotate(${d.getMinutes() * 6} 100 108)`);
    if (alarmTime && alarmTime === `${pad(hr)}:${pad(d.getMinutes())} ${ampm}`) ring();
  }
  setInterval(tick, 1000); tick();
  set.onclick = () => {
    alarmTime = `${h.value}:${m.value} ${ap.value}`;
    set.hidden = true; clear.hidden = false; status.textContent = 'Alarm set for ' + alarmTime;
  };
  clear.onclick = () => {
    alarmTime = ''; ringing = false; clock.classList.remove('shake');
    try { osc && osc.stop(); ctx && ctx.close(); } catch (e) {}
    [h, m, ap].forEach(s => s.value = ''); check();
    clear.hidden = true; set.hidden = false; status.textContent = '';
  };
</script>
</body>
</html>
