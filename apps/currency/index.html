<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Currency Converter · Shruti Singhal</title>
<link rel="stylesheet" href="../common.css">
<style>
  :root{--yellow:#f9ba49;--dark-blue:#0c2451;--light-blue:#1b96ff;--orange:#fb8500}
  body{min-height:100vh;background:linear-gradient(135deg,#ffd27a 0,#f9ba49 35%,#1b96ff 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 16px 32px}
  .card{width:100%;max-width:520px;background:var(--dark-blue);border-radius:25px;padding:24px;color:#fff;box-shadow:0 20px 50px rgba(12,36,81,.4)}
  h1{text-align:center;font-size:30px;margin:0 0 18px;font-weight:600}
  .coin{display:block;margin:0 auto 10px;width:120px;height:120px}
  input,select{width:100%;padding:11px;border-radius:6px;border:0;font-size:16px;color:var(--dark-blue)}
  .amt{margin:18px 0}
  .row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:18px}
  .swap{width:40px;height:40px;border-radius:8px;border:0;background:var(--yellow);color:var(--dark-blue);font-size:20px;cursor:pointer}
  .result{text-align:center;font-size:24px;font-weight:700;color:var(--light-blue);min-height:32px;margin-bottom:12px}
  .result span{color:var(--orange)}
  .err{color:#ff8080;font-size:16px}
  .go{width:100%;background:var(--yellow);border:0;color:var(--dark-blue);font-size:22px;padding:12px;border-radius:6px;cursor:pointer;font-weight:600}
  .credit{color:var(--dark-blue)}
</style>
</head>
<body>
<a class="back" href="../../">← Portfolio</a>
<form class="card" id="form">
  <h1>Currency Converter</h1>
  <svg class="coin" viewBox="0 0 120 120" aria-hidden="true">
    <circle cx="60" cy="60" r="54" fill="#f9ba49"/><circle cx="60" cy="60" r="44" fill="none" stroke="#0c2451" stroke-width="3" stroke-dasharray="4 5"/>
    <text x="60" y="76" text-anchor="middle" font-size="46" font-weight="700" fill="#0c2451" font-family="system-ui">₹$</text>
  </svg>
  <input class="amt" id="amount" type="text" inputmode="decimal" placeholder="Amount" required aria-label="Amount">
  <div class="row">
    <select id="from" aria-label="From currency"></select>
    <button type="button" class="swap" id="swap" title="Swap currencies">⇄</button>
    <select id="to" aria-label="To currency"></select>
  </div>
  <div class="result" id="result"></div>
  <button class="go">Convert</button>
  <p class="credit" style="color:#cfd8ea">Live rates from open.er-api.com · Web version of my Salesforce LWC project</p>
</form>
<script>
  const CODES = ["INR","USD","EUR","GBP","AUD","CAD","JPY","CNY","AED","SGD","CHF","NZD","ZAR","SAR","HKD","SEK","NOK","DKK","KRW","THB","MYR","IDR","PHP","BRL","MXN","RUB","TRY","PKR","BDT","LKR","NPR","QAR","KWD","OMR","BHD"];
  const names = new Intl.DisplayNames(['en'], { type: 'currency' });
  for (const c of CODES) { const n = c + ' – ' + names.of(c); from.add(new Option(n, c)); to.add(new Option(n, c)); }
  from.value = 'USD'; to.value = 'INR';
  const cache = {};
  const clear = () => result.innerHTML = '';
  [from, to, amount].forEach(x => x.addEventListener('input', clear));
  swap.onclick = () => { [from.value, to.value] = [to.value, from.value]; clear(); };
  form.addEventListener('submit', async e => {
    e.preventDefault();
    const amt = parseFloat(amount.value.replace(/,/g, ''));
    if (isNaN(amt)) { result.innerHTML = '<span class="err">Please enter a valid amount.</span>'; return; }
    result.textContent = 'Converting…';
    try {
      if (!cache[from.value]) {
        const r = await fetch('https://open.er-api.com/v6/latest/' + from.value);
        const j = await r.json(); if (j.result !== 'success') throw 0; cache[from.value] = j.rates;
      }
      const v = amt * cache[from.value][to.value];
      const f = n => n.toLocaleString('en-IN', { maximumFractionDigits: 2 });
      result.innerHTML = `${f(amt)} ${from.value} = <span>${f(v)} ${to.value}</span>`;
    } catch (err) { result.innerHTML = '<span class="err">Could not fetch rates. Please try again.</span>'; }
  });
</script>
</body>
</html>
